<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="660" fill="#ffffff"/>
  <text x="480" y="34" font-size="20" font-weight="bold" text-anchor="middle" fill="#000">VRING2 — Wiring Schematic (as-built)</text>

  <!-- ============ XIAO board ============ -->
  <rect x="360" y="100" width="260" height="360" fill="#f4f4f4" stroke="#000" stroke-width="2"/>
  <text x="490" y="126" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">Seeed Studio XIAO</text>
  <text x="490" y="144" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">nRF52840 Sense</text>
  <text x="490" y="255" font-size="11" text-anchor="middle" fill="#333">on-board:</text>
  <text x="490" y="271" font-size="11" text-anchor="middle" fill="#333">PDM microphone</text>
  <text x="490" y="287" font-size="11" text-anchor="middle" fill="#333">LSM6DS3TR-C IMU (I²C 0x6A)</text>
  <text x="490" y="303" font-size="11" text-anchor="middle" fill="#333">USB-C + LiPo charge IC</text>
  <text x="490" y="319" font-size="11" text-anchor="middle" fill="#333">QSPI flash</text>
  <text x="490" y="348" font-size="10" text-anchor="middle" fill="#555">internal only (no wiring needed):</text>
  <text x="490" y="363" font-size="10" text-anchor="middle" fill="#555">VBAT sense divider → P0.31</text>
  <text x="490" y="377" font-size="10" text-anchor="middle" fill="#555">VBAT_ENABLE = P0.14 (active low)</text>
  <text x="490" y="391" font-size="10" text-anchor="middle" fill="#555">HICHG = P0.13 (low = 100 mA charge)</text>

  <!-- pin stubs, left side -->
  <g stroke="#000" stroke-width="2">
    <line x1="310" y1="150" x2="360" y2="150"/>
    <line x1="310" y1="200" x2="360" y2="200"/>
    <line x1="310" y1="280" x2="360" y2="280"/>
    <line x1="310" y1="330" x2="360" y2="330"/>
    <line x1="310" y1="390" x2="360" y2="390"/>
    <line x1="310" y1="440" x2="360" y2="440"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#000">
    <text x="368" y="154">D0</text>
    <text x="368" y="204">D1</text>
    <text x="368" y="284">D4</text>
    <text x="368" y="334">D9</text>
    <text x="368" y="394">D6</text>
    <text x="368" y="444">D7</text>
  </g>

  <!-- pin stubs, right side (battery pads on underside) -->
  <g stroke="#000" stroke-width="2">
    <line x1="620" y1="150" x2="760" y2="150"/>
    <line x1="620" y1="215" x2="760" y2="215"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#000" text-anchor="end">
    <text x="612" y="154">BAT+</text>
    <text x="612" y="219">BAT−</text>
  </g>
  <text x="690" y="238" font-size="10" fill="#555" text-anchor="middle">(pads on underside of board)</text>

  <!-- ============ Battery ============ -->
  <g stroke="#000" stroke-width="2">
    <line x1="760" y1="150" x2="760" y2="160"/>
    <line x1="735" y1="160" x2="785" y2="160"/>
    <line x1="748" y1="172" x2="772" y2="172" stroke-width="4"/>
    <line x1="760" y1="172" x2="760" y2="215"/>
  </g>
  <text x="793" y="164" font-size="13" font-weight="bold" fill="#000">+</text>
  <text x="793" y="180" font-size="13" font-weight="bold" fill="#000">−</text>
  <text x="812" y="164" font-size="12" font-weight="bold" fill="#000">100 mAh LiPo</text>
  <text x="812" y="180" font-size="11" fill="#333">soldered directly</text>
  <text x="812" y="194" font-size="11" fill="#333">to underside pads</text>

  <!-- ============ Vibration motor + MOSFET ============ -->
  <!-- motor circle -->
  <circle cx="258" cy="78" r="18" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="258" y="83" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">M</text>
  <text x="196" y="70" font-size="12" font-weight="bold" fill="#000" text-anchor="end">Vibration</text>
  <text x="196" y="85" font-size="12" font-weight="bold" fill="#000" text-anchor="end">motor</text>
  <text x="196" y="100" font-size="10" fill="#555" text-anchor="end">coin type, 3 V, ~10 mm</text>
  <!-- wire from motor (−) up and across to BAT+ -->
  <g stroke="#000" stroke-width="2" fill="none">
    <polyline points="258,60 258,50 720,50 720,150"/>
  </g>
  <circle cx="720" cy="150" r="3.5" fill="#000"/>
  <text x="300" y="44" font-size="11" fill="#333">motor − → BAT+ (polarity only affects spin direction)</text>

  <!-- MOSFET 2N7000 -->
  <g stroke="#000" stroke-width="2" fill="none">
    <line x1="258" y1="96" x2="258" y2="138"/>          <!-- drain lead from motor -->
    <line x1="250" y1="132" x2="250" y2="168"/>          <!-- channel bar -->
    <line x1="240" y1="135" x2="240" y2="165"/>          <!-- gate plate -->
    <line x1="250" y1="138" x2="258" y2="138"/>          <!-- drain tap -->
    <line x1="250" y1="162" x2="258" y2="162"/>          <!-- source tap -->
    <line x1="258" y1="162" x2="258" y2="200"/>          <!-- source lead -->
    <line x1="240" y1="150" x2="310" y2="150"/>          <!-- gate wire to D0 -->
    <line x1="258" y1="200" x2="310" y2="200"/>          <!-- source to D1 pad -->
  </g>
  <circle cx="258" cy="200" r="3.5" fill="#000"/>
  <!-- ground symbol -->
  <g stroke="#000" stroke-width="2">
    <line x1="258" y1="200" x2="258" y2="228"/>
    <line x1="242" y1="228" x2="274" y2="228"/>
    <line x1="248" y1="235" x2="268" y2="235"/>
    <line x1="254" y1="242" x2="262" y2="242"/>
  </g>
  <text x="232" y="126" font-size="12" font-weight="bold" fill="#000" text-anchor="end">2N7000</text>
  <text x="266" y="132" font-size="11" fill="#333">D</text>
  <text x="266" y="178" font-size="11" fill="#333">S</text>
  <text x="234" y="146" font-size="11" fill="#333" text-anchor="end">G</text>
  <text x="40" y="256" font-size="10" fill="#555">D1 pad is jumpered to GND and used as the solder</text>
  <text x="40" y="269" font-size="10" fill="#555">anchor for the MOSFET source (D1 unused in firmware)</text>

  <!-- ============ Capacitive channel 1: D4 -> 1M -> D9 ============ -->
  <g stroke="#000" stroke-width="2" fill="none">
    <polyline points="310,280 270,280 270,292"/>
    <rect x="262" y="292" width="16" height="28" fill="#fff"/>
    <polyline points="270,320 270,330 310,330"/>
    <polyline points="290,330 230,330"/>
  </g>
  <circle cx="290" cy="330" r="3.5" fill="#000"/>
  <rect x="200" y="322" width="30" height="16" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="215" y="356" font-size="11" font-weight="bold" text-anchor="middle" fill="#000">electrode 1</text>
  <text x="215" y="369" font-size="10" text-anchor="middle" fill="#555">(exposed wire / pad)</text>
  <text x="256" y="308" font-size="12" font-weight="bold" fill="#000" text-anchor="end">R1</text>
  <text x="256" y="322" font-size="11" fill="#000" text-anchor="end">1 MΩ</text>
  <text x="316" y="274" font-size="10" fill="#555">drive</text>
  <text x="316" y="324" font-size="10" fill="#555">sense</text>

  <!-- ============ Capacitive channel 2: D6 -> 1M -> D7 ============ -->
  <g stroke="#000" stroke-width="2" fill="none">
    <polyline points="310,390 270,390 270,402"/>
    <rect x="262" y="402" width="16" height="28" fill="#fff"/>
    <polyline points="270,430 270,440 310,440"/>
    <polyline points="290,440 230,440"/>
  </g>
  <circle cx="290" cy="440" r="3.5" fill="#000"/>
  <rect x="200" y="432" width="30" height="16" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="215" y="466" font-size="11" font-weight="bold" text-anchor="middle" fill="#000">electrode 2</text>
  <text x="215" y="479" font-size="10" text-anchor="middle" fill="#555">(exposed wire / pad)</text>
  <text x="256" y="418" font-size="12" font-weight="bold" fill="#000" text-anchor="end">R2</text>
  <text x="256" y="432" font-size="11" fill="#000" text-anchor="end">1 MΩ</text>
  <text x="316" y="384" font-size="10" fill="#555">drive</text>
  <text x="316" y="434" font-size="10" fill="#555">sense</text>

  <!-- ============ Notes ============ -->
  <rect x="40" y="500" width="880" height="140" fill="#fafafa" stroke="#000" stroke-width="1"/>
  <text x="52" y="521" font-size="12" font-weight="bold" fill="#000">Notes</text>
  <text x="52" y="540" font-size="11" fill="#000">1. Pin roles from firmware (vring2.ino): D0 = vibration PWM • D4/D9 = cap ch.1 drive/sense • D6/D7 = cap ch.2 drive/sense.</text>
  <text x="52" y="556" font-size="11" fill="#000">&#160;&#160;&#160;&#160;The firmware overrides the old README's "pins 5 and 7" — wire the second channel D6 ↔ D7.</text>
  <text x="52" y="574" font-size="11" fill="#000">2. Capacitive sensing = RC charge time: drive goes HIGH, firmware counts until sense (via 1 MΩ) reads HIGH; a finger slows the rise.</text>
  <text x="52" y="592" font-size="11" fill="#000">3. No flyback diode fitted in the as-built unit; an optional 1N4148 across the motor (cathode toward BAT+) adds robustness.</text>
  <text x="52" y="610" font-size="11" fill="#000">4. Mic, IMU, temperature, battery sense and charging are all on the XIAO Sense — no external wiring needed for them.</text>
  <text x="52" y="628" font-size="11" fill="#000">5. Everything solders directly to the XIAO; battery sits under the board, velcro strap threads through and is hot-glued in place.</text>
</svg>
