; Arduino Uno + ROBOTIS DYNAMIXEL Shield gateway.
; upload_port is intentionally omitted so PlatformIO auto-detects the Uno on
; Windows (COMx), macOS (/dev/cu.usbmodem*), and Linux (/dev/ttyACM*).
; Override per machine with: pio run -t upload --upload-port <port>
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 57600
lib_deps =
    robotis-git/DynamixelShield
    robotis-git/Dynamixel2Arduino
