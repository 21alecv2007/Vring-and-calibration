; First-generation M5StickC Plus (ESP32-PICO-D4, AXP192) USB<->UART bridge.
; upload_port is intentionally omitted so PlatformIO auto-detects the M5 on
; Windows (COMx), macOS (/dev/cu.usbserial*), and Linux (/dev/ttyUSB*).
; Override per machine with: pio run -t upload --upload-port <port>
[env:m5stick-c]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
upload_speed = 115200
